name: Validate published assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/validate_repository.py
      - run: bash -n scripts/env.sh scripts/setup.sh scripts/download_model.sh scripts/run_distributed_smoke.sh scripts/run_profile.sh
      - run: python -m py_compile scripts/*.py